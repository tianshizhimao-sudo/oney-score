<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2F4F3">
  <title>Bank-Ready Score report | Oney &amp; Co</title>
  <meta name="description" content="A Bank-Ready Score lending-readiness report generated for review.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://score.oneyco.com.au/report.html">
  <link rel="icon" href="assets/svg/oney-icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Apply the validated preference before styles paint; assessment storage is untouched. -->
  <script>
    (function () {
      var theme = 'light';
      try { if (localStorage.getItem('oney-theme') === 'dark') theme = 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="assets/css/brand.css">
  <link rel="stylesheet" href="assets/css/score-report.css">
</head>
<body class="report-doc-body">
  <nav class="oney-nav report-doc-nav" aria-label="Primary">
    <div class="nav-inner">
      <a href="https://oneyco.com.au/" class="nav-logo" aria-label="Oney & Co home">
        <img class="oney-logo-mark" src="assets/svg/oney-icon.svg" alt="" width="31" height="31">
        <span class="nav-logo-text">Oney <span class="amp">&amp;</span> Co<span class="oney-dot">.</span></span>
      </a>
      <div class="nav-right">
        <div class="theme-switcher" role="group" aria-label="Colour theme">
          <button type="button" class="theme-dot" data-theme="light" aria-pressed="true" aria-label="Light theme">Light</button>
          <button type="button" class="theme-dot" data-theme="dark" aria-pressed="false" aria-label="Dark theme">Dark</button>
        </div>
        <button type="button" id="reportPrint" class="btn-ghost">Download / print</button>
        <a href="/" class="btn-purple">Back to Score</a>
      </div>
    </div>
  </nav>

  <main class="report-doc-main">
    <div id="reportMount" class="report-doc"></div>
  </main>

  <script src="assets/js/brand.js"></script>
  <script src="assets/js/score.report.adapters.js"></script>
  <script src="assets/js/score.report.view.js"></script>
</body>
</html>
